
spring:
  application:
    name: safra-control

  datasource:
    url: jdbc:postgresql://localhost:5432/safracontrol
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082
